[project]
name = "ragserver"
version = "0.1.1"
description = "RAG Collection Server - AI knowledge base management platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "langchain>=0.3.20",
    "langchain-openai>=0.3.7",
    "langchain-community>=0.0.20",
    "langchain-core>=0.2.37",
    "langchain-text-splitters>=0.0.1",
    "langchain-postgres>=0.0.14rc1",
    "langgraph-sdk>=0.1.48",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.34.0",
    "aiohttp>=3.12.13",
    "python-multipart>=0.0.20",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.12.3",
    "pdfminer.six>=20231228",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.6",
    "pillow>=11.2.1",
    "pdfminer.six>=20250416",
    "lxml>=5.4.0",
    "unstructured>=0.17.2",
    "python-jose[cryptography]>=3.3.0",
    "minio>=7.2.9",
    "email-validator>=2.2.0",
    "greenlet>=3.2.3",
    "langchain-ollama>=0.3.3",
    "pgvector>=0.3.6",
    "sqlalchemy>=2.0.41",
    "sqladmin>=0.21.0",
    "scalar-fastapi>=1.4.3",
    "pytest>=8.4.1",
    "pytest-asyncio>=0.26.0",
    "bcrypt>=5.0.0",
    "aioboto3>=15.4.0",
    "loguru>=0.7.3",
    "python-magic>=0.4.27",
    "alembic>=1.17.1",
    "python-docx>=1.2.0",
    "pandas>=2.3.3",
    "tabulate>=0.9.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "python-pptx>=1.0.2",
    "scikit-learn>=1.7.2",
    "img2pdf>=0.6.1",
    "pymupdf>=1.26.5",
    "fastapi-radar>=0.3.4",
    "pre-commit>=4.4.0",
]

[project.packages]
find = { where = ["ragserver"] }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ragserver"]

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "langgraph-api>=0.0.28",
    "langgraph-cli>=0.1.75",
    "pytest-socket>=0.7.0",
    "pytest-timeout>=2.4.0",
    "pytest-asyncio>=1.0.0",
    "mypy>=1.18.1",
]

[tool.pytest.ini_options]
minversion = "8.0"
# -ra: Report all extra test outcomes (passed, skipped, failed, etc.)
# -q: Enable quiet mode for less cluttered output
# -v: Enable verbose output to display detailed test names and statuses
# --durations=5: Show the 10 slowest tests after the run (useful for performance tuning)
addopts = "-ra -q -v --durations=5"
testpaths = [
    "tests",
]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "UP",
]
lint.ignore = [
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D415",  # Add closing punctuation
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "build", "dist"]
skips = ["B101", "B601"]  # B101: assert_used (needed in tests), B601: paramiko calls

[tool.bandit.assert_used]
skips = ["*/test_*.py", "*/tests/*"]

